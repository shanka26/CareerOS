services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: careeros
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careeros"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - careeros-postgres:/var/lib/postgresql/data

volumes:
  careeros-postgres:
